---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headplane
subjects:
  - kind: ServiceAccount
    name: headplane
{{- if .Values.relay.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-relay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-relay
subjects:
  - kind: ServiceAccount
    name: tailscale-relay
{{- end }}
