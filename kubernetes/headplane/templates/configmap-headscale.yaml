---
# The headscale configuration. This ConfigMap is the single source of truth:
# it is mounted read-only, so nothing in the cluster can edit it and drift away
# from the values in git.
#
# Mounted as a directory (never with subPath) so kubelet keeps republishing it
# as the ConfigMap changes. headscale watches the file and reloads the sections
# it can apply live; the rest is covered by the StatefulSet's checksum
# annotation, which restarts the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
data:
  config.yaml: |
    {{- include "headplane.headscaleConfig" (dict "Values" .Values "includeReloadable" true) | nindent 4 }}
